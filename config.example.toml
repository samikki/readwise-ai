# readwise-ai configuration
# Copy this file to config.toml and fill in your values.
# CLI flags always override these values.
# Secrets (API tokens) go in .env, not here.

[openai]
model = "gpt-4o"

[fetch]
# How many days back to fetch articles (1 = last 24 hours)
days = 1
# Readwise Reader locations to fetch from (fetches all, deduplicates)
# Options: new, later, shortlist, archive, feed
sources = ["feed", "later"]
# Maximum articles to pass to the model (more = richer context, higher cost)
max_articles = 100
# Auto-delete generated summaries older than this many days from Readwise
summary_retention_days = 7

[tags]
# Articles tagged with any of these are excluded entirely from the briefing
ignore = ["Summary"]

[output]
# Language for the generated summary
language = "English"
# URL prefix used to identify and clean up AI-generated summaries.
# Use a URL on a domain you own — this is stored in Readwise as the article URL.
# Must end with a slash.
summary_url_prefix = "https://yourdomain.com/readwise-ai/summary/"

[profile]
# Your name — used in summary titles
name = "Reader"
# Path to your taste profile source (used by sync_profile.py to sync from e.g. Obsidian).
# Leave empty if you edit taste_profile.md directly.
source = ""
